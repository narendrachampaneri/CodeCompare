# Builds CodeCompare on GitHub's Windows machines.
#  * Every push / pull request: build + run tests, then upload
#      - CodeCompare-windows          (portable folder: .exe + Qt DLLs)
#      - CodeCompare-installer        (CodeCompare-<version>-Setup.exe)
#  * Pushing a version tag (e.g. v0.1.1) or publishing a release with that tag:
#    attaches the Setup.exe and the portable zip to the GitHub Release.
name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach files to the Release on tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $v = "${{ github.ref_name }}".Substring(1)
          } else {
            $m = Select-String -Path CMakeLists.txt -Pattern 'VERSION\s+(\d+\.\d+\.\d+)' | Select-Object -First 1
            $v = $m.Matches[0].Groups[1].Value
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package (portable folder)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/CodeCompare.exe dist/
          Copy-Item build/codecompare-cli.exe dist/
          Copy-Item README.md, LICENSE dist/
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw dist/CodeCompare.exe

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=..\dist" installer\CodeCompare.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer-out

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: CodeCompare-windows
          path: dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CodeCompare-installer
          path: installer-out/*.exe

      - name: Zip portable version for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "CodeCompare-${{ steps.ver.outputs.version }}-windows-x64-portable.zip"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-out/CodeCompare-${{ steps.ver.outputs.version }}-Setup.exe
            CodeCompare-${{ steps.ver.outputs.version }}-windows-x64-portable.zip
          generate_release_notes: true
